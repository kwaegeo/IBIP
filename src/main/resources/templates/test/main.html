<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
    $(document).ready(function () {
        const ctx = document.getElementById('myChart');

        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['스포츠 조선', '세계일보', '국민일보'],
                datasets: [{
                    label: '# 언론사별 기사 조회 수',
                    data: [12, 19, 5],
                    borderWidth: 1
                }]
            },
            options: {
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });

        const polar = document.getElementById('polarArea');
        const data = {
            labels: [
                '스포츠',
                '경제',
                '정치',
                '날씨',
                'IT'
            ],
            datasets: [{
                label: 'My First Dataset',
                data: [11, 16, 7, 3, 14],
                backgroundColor: [
                    'rgb(255, 99, 132)',
                    'rgb(75, 192, 192)',
                    'rgb(255, 205, 86)',
                    'rgb(201, 203, 207)',
                    'rgb(54, 162, 235)'
                ]
            }]
        };

        new Chart(polar, {
            type: 'polarArea',
            data: data,
            options: {
            }
        });

    });

</script>
